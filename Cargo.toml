[package]
name = "smtc-now-playing"
version = "2.2.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "SMTC-Now-Playing"
path = "src/main.rs"

[dependencies]
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
tray-icon = { version = "0.19", default-features = false }
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true