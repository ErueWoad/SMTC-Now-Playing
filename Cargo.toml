[package]
name = "smtc-now-playing"
version = "2.2.9"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.20"
windows = { version = "0.60", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true